name: E2E Tests (SNO cluster)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege default — nothing here needs write access to the repo.
permissions:
  contents: read


jobs:
  e2e:
    runs-on: [self-hosted, Linux, S390X]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the cluster
        run: |
          oc login "${{ secrets.SNO_API_SERVER }}" \
            --token="${{ secrets.SNO_SA_TOKEN }}" \
            --insecure-skip-tls-verify=false
           echo "Successfully logged in to SNO cluster"
           oc whoami  
          oc project e2e-tests
